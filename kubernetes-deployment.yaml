---
# Kubernetes example using existing media PVCs and secret references.
# Change namespace, image tag, provider URLs, PVC names and ingress settings.
# For an existing deployment, merge changes rather than applying this whole file.

apiVersion: v1
kind: Namespace
metadata:
  name: themarr

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: themarr-config
  namespace: themarr
data:
  # Update these values to match your environment
  PLEX_URL: "http://plex.example.com:32400"
  # Jellyfin server URL (leave PLEX_URL/JELLYFIN_URL blank to disable a provider)
  JELLYFIN_URL: "http://jellyfin.example.com:8096"
  # Optional: force a specific Jellyfin user id; defaults to first user if unset
  # JELLYFIN_USER_ID: ""
  DEFAULT_THEME: "dark"
  DEFAULT_VIEW: "list"
  DISABLE_AUTH: "false"
  NOTIFY_ON_WEBHOOK_DOWNLOAD: "true"
  NOTIFY_ON_WEBHOOK_FAILURE: "true"
  NOTIFY_ON_UI_DOWNLOAD: "true"

# Create themarr-secrets separately; never put real credentials in this template.
# Required keys: API_KEY, AUTH_USERNAME, AUTH_PASSWORD.
# Provider keys: PLEX_TOKEN and/or JELLYFIN_API_KEY.
# Optional keys: PUSHOVER_APP_TOKEN, PUSHOVER_USER_KEY.
# /mcp always requires API_KEY, even with DISABLE_AUTH=true behind a trusted proxy.

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: themarr
  namespace: themarr
  labels:
    app.kubernetes.io/name: themarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: themarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: themarr
    spec:
      automountServiceAccountToken: false
      # Pod-level security context
      securityContext:
        runAsNonRoot: true
        # Match the UID with write access to your existing media volumes.
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault

      containers:
      - name: themarr
        image: ghcr.io/timoverbrugghe/themarr:latest
        # Replace latest with a published MCP-enabled tag/digest or your own build.
        # Keep the image's default command: uvicorn app.http_server:app.
        imagePullPolicy: Always

        # Container-level security context
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 999

        # Environment variables from ConfigMap
        envFrom:
        - configMapRef:
            name: themarr-config

        # Sensitive environment variables from Secret
        env:
        - name: PLEX_TOKEN
          valueFrom:
            secretKeyRef:
              name: themarr-secrets
              key: PLEX_TOKEN
              optional: true
        - name: JELLYFIN_API_KEY
          valueFrom:
            secretKeyRef:
              name: themarr-secrets
              key: JELLYFIN_API_KEY
              optional: true
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: themarr-secrets
              key: API_KEY
        - name: AUTH_USERNAME
          valueFrom:
            secretKeyRef:
              name: themarr-secrets
              key: AUTH_USERNAME
        - name: AUTH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: themarr-secrets
              key: AUTH_PASSWORD
        - name: PUSHOVER_APP_TOKEN
          valueFrom:
            secretKeyRef:
              name: themarr-secrets
              key: PUSHOVER_APP_TOKEN
              optional: true
        - name: PUSHOVER_USER_KEY
          valueFrom:
            secretKeyRef:
              name: themarr-secrets
              key: PUSHOVER_USER_KEY
              optional: true
        - name: FLASK_DEBUG
          value: "false"

        # Port configuration
        ports:
        - name: web
          containerPort: 8080
          protocol: TCP

        # Volume mounts for writable directories
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: run
          mountPath: /run
        # Media library mounts (writable for theme.mp3 output)
        - name: tv-shows
          mountPath: /tv
        - name: movies
          mountPath: /movies

        # Resource requests and limits
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi

        # Liveness probe: checks if the application is running
        livenessProbe:
          httpGet:
            path: /health
            port: web
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3

        # Readiness probe: checks if the application is ready to serve traffic
        readinessProbe:
          httpGet:
            path: /health
            port: web
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        startupProbe:
          httpGet:
            path: /health
            port: web
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30

      # Pod-level DNS configuration (optional)
      dnsPolicy: ClusterFirst

      # Restart policy
      restartPolicy: Always

      # Service account (uses default, can be customized for RBAC)
      serviceAccountName: default

      # Affinity rules (optional, customize based on your cluster)
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                  - themarr
              topologyKey: kubernetes.io/hostname

      # Volumes
      volumes:
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 512Mi
      - name: run
        emptyDir:
          medium: Memory
          sizeLimit: 64Mi
      # Existing PVCs must be in the same namespace as the deployment.
      # Container paths must match the paths reported by Plex/Jellyfin.
      - name: tv-shows
        persistentVolumeClaim:
          claimName: tvshows-pvc
      - name: movies
        persistentVolumeClaim:
          claimName: movies-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: themarr
  namespace: themarr
  labels:
    app.kubernetes.io/name: themarr
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: themarr
  ports:
  - name: web
    port: 8080
    targetPort: web
    protocol: TCP

---
# Optional ingress example. Replace the class, host and existing TLS secret.
# For non-NGINX controllers, use their equivalent timeout settings.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: themarr
  namespace: themarr
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "180"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - themarr.example.com
    secretName: themarr-tls
  rules:
  - host: themarr.example.com
    http:
      paths:
      # Prefix / includes the Web UI, API and API-key-protected /mcp endpoint.
      - path: /
        pathType: Prefix
        backend:
          service:
            name: themarr
            port:
              number: 8080
